name: Refresh property listings

on:
  schedule:
    # Every 3 days at 13:00 UTC. Each run spends 3 RentCast calls (one per
    # pack), so this stays well inside the free tier's 50 calls/month while
    # keeping the listings cycling.
    - cron: "0 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node scripts/fetch-properties.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Refresh property listings"
          git push
