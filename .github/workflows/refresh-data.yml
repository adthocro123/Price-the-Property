name: Refresh property listings

on:
  schedule:
    # Mondays at 13:00 UTC. Each run spends one RentCast call per pack (8),
    # so weekly lands around 35 of the free tier's 50 calls/month — leaving
    # headroom for manual runs. Each run pulls 100 fresh listings per pack,
    # so there's plenty to cycle through between refreshes.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node scripts/fetch-properties.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Refresh property listings"
          git push
