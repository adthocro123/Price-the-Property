name: Refresh property listings

on:
  schedule:
    # 1st and 15th at 13:00 UTC. Each run spends one RentCast call per pack
    # (8), so this uses ~16 of the free tier's 50 calls/month and leaves room
    # for manual runs. Each refresh pulls 100 listings per pack, so there is
    # plenty to cycle through in between. The script also enforces its own
    # monthly cap, so extra manual runs can't quietly run up an overage bill.
    - cron: "0 13 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node scripts/fetch-properties.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Refresh property listings"
          git push
